<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6ff5"/>
      <stop offset="1" stop-color="#7b4fe0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5bea"/>
      <stop offset="1" stop-color="#7b4fe0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1446" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#shine)"/>

  <!-- Hoja de papel -->
  <g filter="url(#shadow)" transform="rotate(-7 512 520)">
    <rect x="252" y="206" width="520" height="640" rx="44" fill="#fffefb"/>
    <path d="M252 250 Q252 206 296 206 L728 206 Q772 206 772 250 L772 262 L252 262 Z" fill="#eef1fb"/>
    <g stroke="#c9d6f2" stroke-width="7" stroke-linecap="round">
      <line x1="300" y1="366" x2="724" y2="366"/>
      <line x1="300" y1="446" x2="724" y2="446"/>
      <line x1="300" y1="526" x2="724" y2="526"/>
      <line x1="300" y1="606" x2="724" y2="606"/>
      <line x1="300" y1="686" x2="724" y2="686"/>
      <line x1="300" y1="766" x2="600" y2="766"/>
    </g>
    <line x1="344" y1="262" x2="344" y2="846" stroke="#f3b7b2" stroke-width="6"/>
  </g>

  <!-- El trazo, escrito a mano, que cruza la hoja (con borde blanco para que resalte) -->
  <path d="M236 640
           C 300 520, 380 470, 430 540
           C 470 596, 420 680, 470 690
           C 540 704, 560 470, 640 470
           C 700 470, 690 560, 760 540
           C 800 528, 820 490, 846 452"
        fill="none" stroke="#ffffff" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236 640
           C 300 520, 380 470, 430 540
           C 470 596, 420 680, 470 690
           C 540 704, 560 470, 640 470
           C 700 470, 690 560, 760 540
           C 800 528, 820 490, 846 452"
        fill="none" stroke="url(#ink)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236 640
           C 300 520, 380 470, 430 540
           C 470 596, 420 680, 470 690
           C 540 704, 560 470, 640 470
           C 700 470, 690 560, 760 540
           C 800 528, 820 490, 846 452"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" transform="translate(-6 -10)"/>
</svg>
