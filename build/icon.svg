<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Carita feliz dibujada a mano: el lápiz amarillo está terminando la sonrisa. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3eee4"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ff6"/>
      <stop offset="1" stop-color="#2447c9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="0.5" stop-color="#ffc629"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1c2a66" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Fondo: papel cálido -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#e4dccd" stroke-width="3"/>

  <g transform="translate(-34 6)">
  <g filter="url(#soft)" stroke-linecap="round" fill="none">
    <!-- Ojos: trazos cortos, apenas inclinados -->
    <path d="M388 318 C 382 368, 384 418, 392 468" stroke="url(#ink)" stroke-width="62"/>
    <path d="M592 310 C 590 362, 594 412, 600 460" stroke="url(#ink)" stroke-width="62"/>
    <!-- Sonrisa: un solo trazo que termina en la punta del lápiz -->
    <path d="M262 596 C 318 742, 452 796, 574 770 C 646 755, 700 712, 734 660" stroke="url(#ink)" stroke-width="62"/>
  </g>

  <!-- Lápiz: la punta toca el final de la sonrisa -->
  <g filter="url(#soft)" transform="translate(734 660) rotate(-58) scale(0.86)">
    <!-- madera de la punta -->
    <path d="M0 0 L78 -34 L78 34 Z" fill="#f6d3a6"/>
    <!-- mina -->
    <path d="M0 0 L26 -11.3 L26 11.3 Z" fill="#2b2f45"/>
    <!-- cuerpo -->
    <rect x="76" y="-36" width="232" height="72" rx="6" fill="url(#body)"/>
    <rect x="76" y="-12" width="232" height="12" fill="#ffe27a" opacity="0.7"/>
    <!-- anillo metálico -->
    <rect x="300" y="-37" width="34" height="74" rx="5" fill="#c9ccd6"/>
    <rect x="310" y="-37" width="6" height="74" fill="#aeb2bf"/>
    <!-- borrador -->
    <rect x="328" y="-36" width="54" height="72" rx="22" fill="#ff8fab"/>
  </g>
  </g>
</svg>
