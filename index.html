<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Trazo</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      /* Pantalla de carga: se muestra al instante, antes de que cargue la app. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(circle at 50% 38%, #ffffff 0, #f1f6f6 70%);
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #splash.hide { opacity: 0; transform: scale(1.03); pointer-events: none; }
      @media (prefers-color-scheme: dark) {
        #splash { background: radial-gradient(circle at 50% 38%, #22252b 0, #141518 70%); }
        #splash .splash-name { color: #eceef1; }
      }
      .splash-logo {
        width: 132px; height: 132px;
        filter: drop-shadow(0 18px 30px rgba(11, 95, 90, 0.18));
        animation: splash-pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
      }
      .splash-logo .smile {
        stroke-dasharray: 560; stroke-dashoffset: 560;
        animation: splash-draw 0.9s 0.35s cubic-bezier(0.55, 0.1, 0.25, 1) forwards;
      }
      .splash-logo .pen { opacity: 0; animation: splash-pen 0.9s 0.35s cubic-bezier(0.55, 0.1, 0.25, 1) forwards; }
      .splash-logo .eye { transform-origin: center; transform-box: fill-box; animation: splash-blink 0.35s 1.35s ease-in-out; }
      .splash-name {
        font-size: 22px; font-weight: 650; letter-spacing: 0.01em; color: #1f2328;
        opacity: 0; animation: splash-up 0.5s 0.25s ease-out forwards;
      }
      .splash-bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(16, 179, 168, 0.15); opacity: 0; animation: splash-up 0.4s 0.6s ease-out forwards; }
      .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #10b3a8; animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: none; } }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-pen {
        0% { opacity: 1; transform: translate(-330px, -80px); }
        35% { transform: translate(-200px, 40px); }
        70% { transform: translate(-70px, 40px); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes splash-blink { 50% { transform: scaleY(0.15); } }
      @keyframes splash-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-logo .smile, .splash-logo .pen, .splash-name, .splash-bar { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <!-- La carita del ícono: la sonrisa se dibuja mientras la pluma la recorre. -->
      <svg class="splash-logo" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="s-bg" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#eef5f5" />
          </linearGradient>
          <linearGradient id="s-ink" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2ad4c4" /><stop offset="1" stop-color="#0e9f96" />
          </linearGradient>
          <linearGradient id="s-nib" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1bd" /><stop offset="0.5" stop-color="#f7c348" /><stop offset="1" stop-color="#c98309" />
          </linearGradient>
          <linearGradient id="s-barrel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe27a" /><stop offset="0.45" stop-color="#ffc629" /><stop offset="1" stop-color="#e79c00" />
          </linearGradient>
        </defs>
        <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#s-bg)" />
        <rect x="34" y="34" width="956" height="956" rx="226" fill="none" stroke="#d5e3e3" stroke-width="3" />
        <rect class="eye" x="364" y="318" width="54" height="138" rx="27" fill="#1cc2b4" />
        <rect class="eye" x="578" y="310" width="54" height="138" rx="27" fill="#1cc2b4" />
        <path class="smile" d="M262 580 C 300 700, 420 752, 520 750 C 590 748, 640 730, 668 705" fill="none" stroke="url(#s-ink)" stroke-width="54" stroke-linecap="round" />
        <g class="pen">
          <g transform="translate(668 705) rotate(30) scale(0.86)">
            <path d="M-4 0 C 26 -16, 64 -36, 110 -44 L 124 -34 L 124 34 L 110 44 C 64 36, 26 16, -4 0 Z" fill="url(#s-nib)" />
            <path d="M4 0 L 78 0" stroke="#7a4a00" stroke-width="4.5" stroke-linecap="round" />
            <circle cx="84" cy="0" r="8" fill="#7a4a00" />
            <rect x="118" y="-44" width="34" height="88" rx="8" fill="#c98a12" />
            <rect x="148" y="-46" width="210" height="92" rx="26" fill="url(#s-barrel)" />
            <rect x="162" y="-36" width="180" height="12" rx="6" fill="#ffffff" opacity="0.35" />
          </g>
        </g>
      </svg>
      <div class="splash-name">Trazo</div>
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
